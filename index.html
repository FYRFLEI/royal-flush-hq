<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#46218a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Royal Flush HQ"><title>🚽 Royal Flush HQ</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#30155e,#7842b5 60%,#ff87c9);color:white;min-height:100vh;text-align:center}main{max-width:720px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(30px,7vw,48px);margin:8px 0}p{opacity:.95}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}button{border:3px solid #fff9;border-radius:20px;background:linear-gradient(150deg,#fff8ca,#ffc64e);box-shadow:0 6px 0 #9b5d12;color:#371b54;min-height:104px;padding:14px 7px;font-size:18px;font-weight:800;touch-action:manipulation;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 2px 0 #9b5d12}.stop{background:#ff546f;color:white;box-shadow:0 6px 0 #9a1e3e;width:100%;min-height:70px}.mode{background:#d5edff;box-shadow:0 6px 0 #3970aa}.small{font-size:13px;opacity:.85}#status{min-height:28px;font-weight:700}.spark{position:fixed;pointer-events:none;animation:pop 1s forwards;font-size:28px}@keyframes pop{to{transform:translateY(-120px) rotate(60deg);opacity:0}}@media(max-width:360px){button{font-size:16px}}</style></head><body><main><div style="font-size:48px">🏰🚽👑</div><h1>ROYAL FLUSH HQ</h1><p>Commander Brooklyn's official fortress remote!</p><div id="status" aria-live="polite">Tap a button to start the royal silliness!</div><div class="grid"><button data-sound="fart">💨<br>MEGA FART</button><button data-sound="flush">🌊<br>SUPER FLUSH 9000</button><button data-sound="disco">🪩<br>TOILET DISCO</button><button data-sound="countdown">⏳<br>FLUSH COUNTDOWN</button><button data-sound="plunger">🦸<br>CAPTAIN PLUNGER</button><button data-sound="wipes">🧻<br>SIR WIPES-A-LOT</button><button data-sound="clog">🚨<br>CLOG ALERT</button><button data-sound="award">🏆<br>GOLDEN FLUSH AWARD</button><button data-sound="brother">🚓<br>BROTHER'S SIREN</button><button data-sound="dad">🔫<br>DAD'S LASER</button><button data-sound="brooklyn">✨<br>BROOKLYN'S MAGIC</button><button data-sound="mom">🎺<br>MOM'S FANFARE</button><button data-sound="giggle">😂<br>GIGGLE BUTTON</button><button data-sound="okay">✅<br>TOILET IS OKAY!</button><button class="mode" data-sound="guest">🎩<br>ROYAL GUEST</button><button class="mode" data-sound="night">🌙<br>QUIET NIGHT</button></div><button class="stop" id="stop">🛑 STOP ALL SOUNDS</button><p class="small">All sounds are silly computer-made effects played on this device. No microphones, cameras, sensors, or bathroom detection. Made for fun with Dad's approval. 💖</p></main><script>
let ctx, jobs=[], active=[];const status=document.getElementById('status');function init(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function clear(){jobs.forEach(clearTimeout);jobs=[];active.forEach(o=>{try{o.stop()}catch(e){}});active=[];status.textContent='All quiet at Royal Flush HQ! 🤫'}function later(fn,ms){jobs.push(setTimeout(fn,ms))}function tone(freq=440,dur=.18,type='sine',vol=.16,delay=0,endFreq){later(()=>{if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),ctx.currentTime);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),ctx.currentTime+dur);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur+.01);active.push(o);o.onended=()=>active=active.filter(x=>x!==o)},delay)}function notes(arr,step=180,type='sine'){arr.forEach((n,i)=>tone(n,step/1000*.8,type,.14,i*step))}function speech(s){if(!('speechSynthesis'in window)){status.textContent=s;return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.rate=.95;u.pitch=1.15;speechSynthesis.speak(u)}function stars(){for(let i=0;i<12;i++){let e=document.createElement('div');e.className='spark';e.textContent=['✨','💖','⭐','🪩'][i%4];e.style.left=(10+Math.random()*80)+'vw';e.style.top=(40+Math.random()*50)+'vh';document.body.append(e);setTimeout(()=>e.remove(),1000)}}function play(id){clear();init();const labels={fart:'MEGA FART!',flush:'SUPER FLUSH 9000!',disco:'TOILET DISCO!',countdown:'3, 2, 1, FLUSH!',plunger:'CAPTAIN PLUNGER TO THE RESCUE!',wipes:'SIR WIPES-A-LOT!',clog:'OH NO! TOILET CLOG ALERT!',award:'GOLDEN FLUSH AWARD!',brother:'WEE-WOO!',dad:'PEW PEW!',brooklyn:'MAGIC SPARKLES!',mom:'ROYAL FANFARE!',giggle:'GIGGLE TIME!',okay:'THE TOILET IS OKAY!',guest:'WELCOME, ROYAL GUEST!',night:'SHHH... NIGHT MODE!'};status.textContent=labels[id];switch(id){case'fart':for(let i=0;i<8;i++)tone(110-i*7,.12,'sawtooth',.12,i*100,48);break;case'flush':for(let i=0;i<16;i++)tone(900-i*42,.13,'triangle',.1,i*55,150);break;case'disco':notes([262,330,392,523,392,330,294,349,440,587,440,349,330,392,523,659],155,'square');stars();break;case'countdown':speech('Three! Two! One! FLUSH!');later(()=>play('flush'),2500);break;case'plunger':notes([262,330,392,523],160,'triangle');speech('Captain Plunger! Flush the trouble away!');break;case'wipes':notes([523,392,523,659],140);speech('Somebody call the toilet paper police!');break;case'clog':notes([140,105,140,105,140],380,'sawtooth');speech('Oh no! The toilet is clogged! Captain Plunger, we need you!');break;case'award':notes([392,392,523,659,784],220,'triangle');stars();break;case'brother':for(let i=0;i<6;i++)tone(i%2?460:690,.38,'sawtooth',.08,i*390);break;case'dad':for(let i=0;i<5;i++)tone(1100,.2,'sawtooth',.09,i*260,130);break;case'brooklyn':notes([784,988,1175,1568,1319,1760],140);stars();break;case'mom':notes([392,523,659,784,1047],230,'triangle');break;case'giggle':speech('Hee hee hee! Ha ha ha!');notes([500,620,510,700,540,800],130);break;case'okay':notes([392,523,659,784],170);speech('Everything is A okay!');stars();break;case'guest':notes([392,494,587],220);speech('Welcome, royal guest!');break;case'night':tone(440,.3,'sine',.045);tone(554,.4,'sine',.04,300);break}}
document.querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.sound)));document.getElementById('stop').addEventListener('click',()=>{clear();if('speechSynthesis'in window)speechSynthesis.cancel()});</script></body></html>
